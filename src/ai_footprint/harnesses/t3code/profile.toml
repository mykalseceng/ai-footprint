# t3code: what ai-footprint knows about this harness. Schema: harnesses/profile.py.
#
# T3 Code is a desktop app (Electron) and local server that drives other coding agents
# (Claude Code, Codex, OpenCode, pi and others) with their own logins. Its CLI, `t3`, is
# the same app run as Node: ~/.t3/bin/t3 execs the bundle's apps/server/dist/bin.mjs.
name = "t3code"
display_name = "T3 Code"
binaries = []
process = "T3 Code|t3code|apps/server/dist/bin\\.mjs|/\\.t3/bin/t3"
presence = ["{home}"]
process_words = ["t3code", "t3 code", "/.t3/"]
env_prefixes = ["T3CODE_"]
capabilities = ["remote-control"]
settings = ["runtime_mode", "auth_sessions", "auth_pairing_links", "peer_environment_links", "scheduled_tasks"]
env = [
  "T3CODE_HOME",
  "T3CODE_TELEMETRY_ENABLED",
  "T3CODE_HOST",
  "T3CODE_PORT",
  "T3CODE_TAILSCALE_SERVE",
  "T3CODE_RELAY_URL",
  "T3CODE_OTLP_TRACES_URL",
  "T3CODE_OTLP_LOGS_URL",
  "T3CODE_OTLP_METRICS_URL",
  "T3CODE_OTEL_SDK_DISABLED",
  "T3CODE_SERVER_BROWSER_SANDBOX",
  "T3CODE_DISABLE_AUTO_UPDATE",
]

[roots]
home = { env = "T3CODE_HOME", default = "~/.t3" }
support = { default = "~/Library/Application Support/t3code-v2" }
launch_agents = { default = "~/Library/LaunchAgents" }
user_apps = { default = "~/Applications" }
system_apps = { default = "/Applications" }

[drives]
claudeAgent = "claude"
codex = "codex"
opencode = "opencode"
pi = "pi"

[signals]
approval_off_flagged = ["threads with runtime_mode=full-access"]

[[artifacts]]
label = "Account token"
path = "{home}/userdata/clerk-tokens.json"
category = "credential"
description = "Clerk client JWT for the T3 account (T3 Connect sign-in); Electron safeStorage ciphertext (enc:) whose key is in the Keychain, or plaintext (raw:)"

[[artifacts]]
label = "Server keys"
path = "{home}/userdata/secrets"
category = "credential"
description = "Server, MCP OAuth and asset signing keys, request salt, cloud-link Ed25519 key pair"

[[artifacts]]
label = "State DB"
path = "{home}/userdata/statev2.sqlite"
category = "session"
description = "Threads, messages and tool output, paired client sessions, pairing links, scheduled tasks"

[[artifacts]]
label = "Legacy state DB"
path = "{home}/userdata/state.sqlite"
category = "session"
description = "Database from versions before 0.1.0, kept after migration for rollback"

[[artifacts]]
label = "Server settings"
path = "{home}/userdata/settings.json"
category = "config"
description = "Server-side settings: providers, permissions defaults, cleanup, observability"

[[artifacts]]
label = "Server owner DB"
path = "{home}/userdata/server-owner.sqlite"
category = "session"
description = "Which process owns the local server"

[[artifacts]]
label = "Attachments"
path = "{home}/userdata/attachments"
category = "session"
description = "Files attached to prompts"

[[artifacts]]
label = "Logs"
path = "{home}/userdata/logs"
category = "log"
description = "Server and desktop traces, provider and terminal logs"

[[artifacts]]
label = "Client settings"
path = "{home}/userdata/client-settings.json"
category = "config"
description = "App preferences, browser profiles, notifications"

[[artifacts]]
label = "Desktop settings"
path = "{home}/userdata/desktop-settings.json"
category = "config"
description = "Window state"

[[artifacts]]
label = "Install identifiers"
path = "{home}/userdata/anonymous-id"
category = "config"
description = "Stable anonymous id sent with usage events"

[[artifacts]]
label = "Environment id"
path = "{home}/userdata/environment-id"
category = "config"
description = "Id of this machine as a T3 environment"

[[artifacts]]
label = "Model manifest"
path = "{home}/userdata/model-manifest.json"
category = "cache"
description = "Models each provider offers"

[[artifacts]]
label = "Provider caches"
path = "{home}/caches"
category = "cache"
description = "Per-provider model catalogs and pull-request cache"

[[artifacts]]
label = "Worktrees"
path = "{home}/worktrees"
category = "session"
description = "Git worktrees threads work in"

[[artifacts]]
label = "Scratch folders"
path = "{home}/scratch"
category = "session"
description = "Working folders of threads without a project; kept after the thread is deleted"

[[artifacts]]
label = "New projects"
path = "{home}/projects"
category = "session"
description = "Git repositories created with New project"

[[artifacts]]
label = "ACP agents"
path = "{home}/tools"
category = "binary"
description = "Agents installed from the ACP Registry, by agent id and version"

[[artifacts]]
label = "Service environment"
path = "{home}/service.env"
category = "config"
description = "Variables for the background service; may hold credentials"

[[artifacts]]
label = "CLI launcher"
path = "{home}/bin"
category = "binary"
description = "t3 launcher that runs the desktop app's bundled CLI"

[[artifacts]]
label = "Background service"
path = "{launch_agents}/com.t3tools.t3code.service.plist"
category = "extension"
description = "launchd agent that starts the T3 server at login"

[[artifacts]]
label = "Browser profile"
path = "{support}"
category = "session"
description = "Electron profile: cookies, local storage, IndexedDB"

[[endpoints]]
host = "app.t3.codes"
purpose = "Web app and hosted pairing page"

[[endpoints]]
host = "relay.t3.codes"
purpose = "T3 Connect relay (sets up remote connections)"

[[endpoints]]
host = "ingest.t3.codes"
purpose = "Product usage events"

[[endpoints]]
host = "us-east-1.aws.edge.axiom.co"
purpose = "T3 Connect relay connection traces (Axiom)"

[[endpoints]]
host = "clerk.com"
purpose = "T3 account sign-in (Clerk)"

[[endpoints]]
host = "clerk-telemetry.com"
purpose = "Clerk SDK telemetry"

[[fingerprint]]
label = "Data folder"
value = "~/.t3, or T3CODE_HOME"
marker = "T3CODE_HOME"

[[fingerprint]]
label = "Account token"
value = "__clerk_client_jwt in userdata/clerk-tokens.json"
marker = "__clerk_client_jwt"

[[fingerprint]]
label = "Server keys"
value = "server-signing-key, cloud-link-ed25519-key-pair in userdata/secrets"
marker = "cloud-link-ed25519-key-pair"

[[fingerprint]]
label = "Background service"
value = "launchd agent com.t3tools.t3code.service"
marker = "com.t3tools.t3code.service"

[[fingerprint]]
label = "Permission modes"
value = "approval-required, auto-accept-edits, full-access (default for new threads)"
marker = "full-access"

[remedies.require-approval]
summary = "Require approval for new and existing threads"
commands = [
  { manual = "Set Settings → Threads → New threads → Permissions to Supervised, and switch each full-access thread to Supervised in the composer", markers = ["Supervised", "approval-required"] },
]

[remedies.stop-daemons]
summary = "Stop the background service and remove it from login"
commands = [
  { manual = "Run ~/.t3/bin/t3 service uninstall", markers = ["service uninstall"] },
]

[remedies.protect-credentials]
summary = "Keep T3 Code's keys private and sign out where you do not use T3 Connect"
commands = [
  { manual = "Keep ~/.t3/userdata/secrets at mode 700 and its key files at 600", markers = ["server-signing-key"] },
  { manual = "Sign out in Settings → Sharing & access if you do not use T3 Connect", markers = ["Sharing & access"] },
  { manual = "chmod 600 ~/.t3/service.env if it holds credentials", markers = ["service.env"] },
]

[remedies.data-controls]
summary = "Turn off usage events and agent activity publishing"
commands = [
  { manual = "Set T3CODE_TELEMETRY_ENABLED=false in your shell profile and in ~/.t3/service.env", markers = ["T3CODE_TELEMETRY_ENABLED"] },
  { manual = "Turn off Publish agent activity in Settings → Sharing & access", markers = ["Publish agent activity"] },
]

