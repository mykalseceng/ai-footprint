[[features]]
kind = "setting"
name = "runtime_mode"
summary = "Per-thread permission mode; full-access runs commands and edits without approval and is the default"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/permission-modes.md"
marker = "full-access"
checks = ["no-approval"]

[[features]]
kind = "integration"
name = "pairing"
summary = "One-time pairing links issue bearer sessions; without --scope they carry every permission"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "auth_pairing_links"
checks = ["remote-control"]

[[features]]
kind = "integration"
name = "T3 Connect"
summary = "Links this machine to a T3 account so paired devices reach it through a Cloudflare tunnel"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "relay.t3.codes"
checks = ["remote-control"]

[[features]]
kind = "env"
name = "T3CODE_TAILSCALE_SERVE"
summary = "Serves the T3 server over Tailscale HTTPS"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "T3CODE_TAILSCALE_SERVE"

[[features]]
kind = "env"
name = "T3CODE_HOST"
summary = "Address the server listens on; a LAN address exposes it to the network"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/background-service.md"
marker = "T3CODE_HOST"
checks = ["daemons"]

[[features]]
kind = "path"
name = "~/Library/LaunchAgents/com.t3tools.t3code.service.plist"
summary = "Background service that starts the server at login"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/background-service.md"
marker = "com.t3tools.t3code.service"
checks = ["autostart", "daemons"]

[[features]]
kind = "path"
name = "~/.t3/service.env"
summary = "Environment for the background service; the docs say to chmod 600 it if it holds credentials"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/background-service.md"
marker = "service.env"
checks = ["data-readable"]

[[features]]
kind = "env"
name = "T3CODE_TELEMETRY_ENABLED"
summary = "false turns off product usage events"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/faq.md"
marker = "T3CODE_TELEMETRY_ENABLED"
checks = ["account-data"]

[[features]]
kind = "subcommand"
name = "auth"
summary = "Inspect sessions, manage pairing credentials, revoke access"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "t3 auth"

[[features]]
kind = "integration"
name = "scheduled tasks"
summary = "Prompts that run on a schedule or from a webhook, without anyone at the keyboard"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/project-settings.md"
marker = "scheduled_tasks"
checks = ["autostart"]

[[features]]
kind = "integration"
name = "webhook tasks"
summary = "A public T3 Connect URL starts a run; without Require signature anyone with the URL can"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/project-settings.md"
marker = "On webhook"
checks = ["autostart"]

[[features]]
kind = "setting"
name = "Hold webhooks while offline"
summary = "T3 Connect stores webhook request bodies for up to 24 hours while the machine is offline"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/project-settings.md"
marker = "Hold webhooks while offline"

[[features]]
kind = "setting"
name = "Network access"
summary = "Desktop server listens on the LAN and tailnet; a pairing code is all that keeps others out"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "Network access"
checks = ["daemons"]

[[features]]
kind = "subcommand"
name = "up"
summary = "Chooses T3 Connect and/or LAN access and installs the background service"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "t3 up"
checks = ["daemons", "autostart"]

[[features]]
kind = "integration"
name = "linked environments"
summary = "Agents on a linked machine launch and steer threads here, up to full access, for 30 days"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
marker = "peer_environment_links"

[[features]]
kind = "integration"
name = "outside agents"
summary = "Agents T3 Code did not start sign in to its /mcp server with OAuth and run threads"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/outside-agents.md"
marker = "Copy MCP URL"

[[features]]
kind = "integration"
name = "guest links"
summary = "A 24-hour link lets someone without an account watch a thread and queue messages"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/guest-links.md"
marker = "Share with guest"

[[features]]
kind = "env"
name = "T3CODE_SERVER_BROWSER_SANDBOX"
summary = "0 turns off Chrome's sandbox for the browser agents drive"
doc = "https://github.com/pingdotgg/t3code/blob/main/docs/user/remote-access.md"
