# claude: what ai-footprint knows about this harness. Schema: harnesses/profile.py.
name = "claude"
display_name = "Claude Code"
binaries = ["claude"]
process = "(^|/)claude(\\s|$)"
presence = ["{home}/.claude", "{home}/.claude.json"]
process_words = ["claude"]
env_prefixes = ["CLAUDE_CODE_", "ANTHROPIC_"]
settings = ["defaultMode", "skipDangerousModePermissionPrompt", "disableBypassPermissionsMode", "enableAllProjectMcpServers", "cleanupPeriodDays", "DISABLE_TELEMETRY", "DISABLE_ERROR_REPORTING", "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC", "claudeInChromeDefaultEnabled"]

[roots]
home = { default = "~" }
managed = { default = "/Library/Application Support/ClaudeCode" }

[[artifacts]]
label = "Global config"
path = "{home}/.claude.json"
category = "config"
description = "Account profile, project paths and trust, MCP servers"

[[artifacts]]
label = "Config backup"
path = "{home}/.claude.json.backup"
category = "config"
description = "Older copy of .claude.json"

[[artifacts]]
label = "Config backups"
path = "{home}/.claude/backups"
category = "config"
description = "Timestamped .claude.json copies"

[[artifacts]]
label = "Settings"
path = "{home}/.claude/settings.json"
category = "config"
description = "Permissions, hooks, plugins, env vars"

[[artifacts]]
label = "Local settings"
path = "{home}/.claude/settings.local.json"
category = "config"
description = "Per-machine settings"

[[artifacts]]
label = "Plaintext credentials"
path = "{home}/.claude/.credentials.json"
category = "credential"
description = "OAuth tokens as JSON"

[[artifacts]]
label = "Transcripts"
path = "{home}/.claude/projects"
category = "session"
description = "Full conversations including every tool input and output"

[[artifacts]]
label = "Tool results"
path = "{home}/.claude/projects/*/*/tool-results"
category = "session"
description = "Tool output too large to keep inline: command output, fetched pages, files read"

[[artifacts]]
label = "Subagent transcripts"
path = "{home}/.claude/projects/*/*/subagents"
category = "session"
description = "Conversations of subagents a session started"

[[artifacts]]
label = "Memory files"
path = "{home}/.claude/projects/*/memory"
