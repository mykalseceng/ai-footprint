[[features]]
kind = "setting"
name = "cleanupPeriodDays"
summary = "Days transcripts and other session data are kept (default 30)"
doc = "https://code.claude.com/docs/en/settings-reference#cleanupperioddays"
marker = "cleanupPeriodDays"

[[features]]
kind = "setting"
name = "hasTrustDialogAccepted"
summary = "Per-project workspace trust in ~/.claude.json; trusted repos apply their settings"
doc = "https://code.claude.com/docs/en/permissions#project-allow-rules-and-workspace-trust"
marker = "hasTrustDialogAccepted"
checks = ["trust"]

[[features]]
kind = "path"
name = "~/.claude/.credentials.json"
summary = "Plaintext login, used on Linux and when the macOS Keychain refuses the write"
doc = "https://code.claude.com/docs/en/authentication#credential-management"
marker = ".credentials.json"
checks = ["creds-plaintext", "creds-readable"]

[[features]]
kind = "env"
name = "ANTHROPIC_API_KEY"
summary = "API key sent as X-Api-Key; overrides the subscription login"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "ANTHROPIC_API_KEY"
checks = ["duplicate-creds"]

[[features]]
kind = "env"
name = "ANTHROPIC_AUTH_TOKEN"
summary = "Bearer token sent in the Authorization header"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "ANTHROPIC_AUTH_TOKEN"
checks = ["duplicate-creds"]

[[features]]
kind = "env"
name = "CLAUDE_CODE_OAUTH_TOKEN"
summary = "claude.ai OAuth token; takes precedence over the Keychain login"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "CLAUDE_CODE_OAUTH_TOKEN"
checks = ["duplicate-creds"]

[[features]]
kind = "subcommand"
name = "setup-token"
summary = "Prints a long-lived OAuth token for scripts and CI"
doc = "https://code.claude.com/docs/en/cli-reference"
marker = "setup-token"

[[features]]
kind = "env"
name = "ANTHROPIC_BASE_URL"
summary = "Sends API requests to another endpoint, such as a proxy or gateway"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "ANTHROPIC_BASE_URL"

[[features]]
kind = "env"
name = "CLAUDE_CONFIG_DIR"
summary = "Moves ~/.claude (settings, history, plugins, credentials) elsewhere"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "CLAUDE_CONFIG_DIR"

[[features]]
kind = "env"
name = "CLAUDE_CODE_SKIP_PROMPT_HISTORY"
summary = "Skips writing prompt history and transcripts to disk"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "CLAUDE_CODE_SKIP_PROMPT_HISTORY"

[[features]]
kind = "env"
name = "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB"
summary = "Strips credentials from the environment of Bash commands, hooks and MCP servers"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "CLAUDE_CODE_SUBPROCESS_ENV_SCRUB"

[[features]]
kind = "env"
name = "CLAUDE_CODE_ENABLE_TELEMETRY"
summary = "Turns on OpenTelemetry metrics and logs export"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "CLAUDE_CODE_ENABLE_TELEMETRY"

[[features]]
kind = "env"
name = "OTEL_EXPORTER_OTLP_ENDPOINT"
summary = "Collector that OpenTelemetry data is sent to"
doc = "https://code.claude.com/docs/en/monitoring-usage"
marker = "OTEL_EXPORTER_OTLP_ENDPOINT"

[[features]]
kind = "env"
name = "OTEL_LOG_USER_PROMPTS"
summary = "Includes prompt text in OpenTelemetry logs and traces"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "OTEL_LOG_USER_PROMPTS"

[[features]]
kind = "env"
name = "OTEL_LOG_TOOL_DETAILS"
summary = "Includes tool arguments, MCP server names and error strings in telemetry"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "OTEL_LOG_TOOL_DETAILS"

[[features]]
kind = "env"
name = "OTEL_LOG_TOOL_CONTENT"
summary = "Includes tool output in trace span events"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "OTEL_LOG_TOOL_CONTENT"

[[features]]
kind = "env"
name = "OTEL_LOG_RAW_API_BODIES"
summary = "Exports full API request and response bodies as log events or files"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "OTEL_LOG_RAW_API_BODIES"

[[features]]
kind = "env"
name = "DISABLE_TELEMETRY"
summary = "Opts out of telemetry and feature-flag fetching"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "DISABLE_TELEMETRY"

[[features]]
kind = "env"
name = "DISABLE_ERROR_REPORTING"
summary = "Opts out of error reporting"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "DISABLE_ERROR_REPORTING"

[[features]]
kind = "env"
name = "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC"
summary = "Turns off updates, telemetry, error reporting and other nonessential traffic"
doc = "https://code.claude.com/docs/en/env-vars"
marker = "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC"

[[features]]
kind = "subcommand"
name = "remote-control"
summary = "Server mode: drive Claude Code on this machine from claude.ai or the Claude app"
doc = "https://code.claude.com/docs/en/cli-reference"
marker = "remote-control"

[[features]]
kind = "setting"
name = "remoteControlAtStartup"
summary = "Connects Remote Control in every interactive session"
doc = "https://code.claude.com/docs/en/settings-reference#remotecontrolatstartup"
marker = "remoteControlAtStartup"

[[features]]
kind = "setting"
name = "disableRemoteControl"
summary = "Refuses Remote Control in every form"
doc = "https://code.claude.com/docs/en/settings-reference#disableremotecontrol"
marker = "disableRemoteControl"

[[features]]
kind = "subcommand"
name = "--channels"
summary = "Lets channel plugins (Telegram, Discord, iMessage) push messages into the session"
doc = "https://code.claude.com/docs/en/channels"
marker = "--channels"

[[features]]
kind = "subcommand"
name = "--dangerously-load-development-channels"
summary = "Loads channels that are not on the approved allowlist"
doc = "https://code.claude.com/docs/en/cli-reference"
marker = "dangerously-load-development-channels"

[[features]]
kind = "setting"
name = "channelsEnabled"
summary = "Managed: allows channels for the organization"
doc = "https://code.claude.com/docs/en/settings-reference#channelsenabled"
marker = "channelsEnabled"

[[features]]
kind = "setting"
name = "allowedChannelPlugins"
summary = "Managed: channel plugins allowed to push messages"
doc = "https://code.claude.com/docs/en/settings-reference#allowedchannelplugins"
marker = "allowedChannelPlugins"

[[features]]
kind = "integration"
name = "Claude Code on the web"
summary = "Cloud sessions that clone your GitHub repos on Anthropic infrastructure"
doc = "https://code.claude.com/docs/en/claude-code-on-the-web"
marker = "githubWebConnectionStatusCache"
checks = ["account-data"]

[[features]]
kind = "subcommand"
name = "daemon"
summary = "Background-session supervisor that keeps sessions running after the terminal closes"
doc = "https://code.claude.com/docs/en/agent-view"
marker = "daemon status"
checks = ["unattended"]
