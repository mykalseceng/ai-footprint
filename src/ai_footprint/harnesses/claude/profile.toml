[[fingerprint]]
label = "User-Agent"
value = "claude-cli/{version} (external, cli)"
marker = "claude-cli/"

[[fingerprint]]
label = "App header"
value = "x-app: cli"
marker = "\"x-app\""

[[fingerprint]]
label = "Beta header"
value = "anthropic-beta: claude-code-20250219,oauth-2025-04-20,…"
marker = "claude-code-20250219"

[[fingerprint]]
label = "Auth header"
value = "Authorization: Bearer sk-ant-oat01-…"
marker = "oauth-2025-04-20"

[[fingerprint]]
label = "OAuth client"
value = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
marker = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"

[[fingerprint]]
label = "Token endpoint"
value = "https://platform.claude.com/v1/oauth/token"
marker = "/v1/oauth/token"

[[fingerprint]]
label = "Keychain item"
value = "Claude Code-credentials (name assembled at runtime)"
marker = "-credentials"

[[fingerprint]]
label = "Child shell"
value = "zsh -c source ~/.claude/shell-snapshots/snapshot-*.sh"
marker = "shell-snapshots"

[[fingerprint]]
label = "Child env"
value = "CLAUDECODE=1, CLAUDE_CODE_ENTRYPOINT, CLAUDE_CODE_SESSION_ID"
marker = "CLAUDE_CODE_ENTRYPOINT"

[[fingerprint]]
label = "Keychain read"
value = "spawns \"security\" by bare name (PATH lookup)"
marker = "\"security\",[\"find-generic-password\""

[signals]
approval_off = { "permissions.defaultMode" = "bypassPermissions" }
approval_off_flagged = ["projects with defaultMode=bypassPermissions"]

[remedies.withdraw-trust]
summary = "Withdraw trust from folders you do not own or no longer use"
commands = [
  { manual = "Set hasTrustDialogAccepted to false for those projects in ~/.claude.json", markers = ["hasTrustDialogAccepted"] },
]

[remedies.data-controls]
summary = "Review the provider's data settings"
commands = [
  { manual = "Turn off model training at claude.ai/settings/data-privacy-controls and disconnect unused connectors" },
]

