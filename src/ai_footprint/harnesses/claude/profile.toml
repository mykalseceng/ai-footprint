[[features]]
kind = "setting"
name = "permissions.defaultMode"
summary = "Mode new sessions start in; bypassPermissions runs every tool without asking"
doc = "https://code.claude.com/docs/en/settings-reference#permissions-defaultmode"
marker = "permissions.defaultMode"
checks = ["no-approval"]

[[features]]
kind = "subcommand"
name = "--dangerously-skip-permissions"
summary = "Starts a session in bypassPermissions mode"
doc = "https://code.claude.com/docs/en/cli-reference"
marker = "dangerously-skip-permissions"
checks = ["no-approval"]

[[features]]
kind = "subcommand"
name = "--allow-dangerously-skip-permissions"
summary = "Adds bypassPermissions to the Shift+Tab cycle without starting in it"
doc = "https://code.claude.com/docs/en/cli-reference"
marker = "allow-dangerously-skip-permissions"

[[features]]
kind = "setting"
name = "skipDangerousModePermissionPrompt"
summary = "Skips the confirmation shown before a session enters bypassPermissions"
doc = "https://code.claude.com/docs/en/settings-reference#skipdangerousmodepermissionprompt"
