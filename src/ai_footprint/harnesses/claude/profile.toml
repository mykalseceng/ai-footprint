[[endpoints]]
host = "downloads.claude.ai"
purpose = "Version checks and updates"

[[endpoints]]
host = "storage.googleapis.com"
purpose = "Release artifacts"

[[endpoints]]
host = "http-intake.logs.us5.datadoghq.com"
purpose = "Error and event logging"

[[endpoints]]
