[[features]]
kind = "setting"
name = "permissionMode"
summary = "Permission mode of each Code session and scheduled task; bypassPermissions runs without prompts"
doc = "https://code.claude.com/docs/en/desktop"
marker = "bypassPermissions"
checks = ["no-approval"]

[[features]]
kind = "setting"
name = "chromePermissionMode"
summary = "Claude in Chrome mode per session and task; skip_all_permission_checks is Skip all approvals, which nothing checks"
doc = "https://support.claude.com/en/articles/12902446-claude-in-chrome-permissions-guide"
marker = "skip_all_permission_checks"
checks = ["no-approval"]

[[features]]
kind = "setting"
name = "bypassPermissionsModeEnabled"
summary = "Allow bypass permissions mode: makes Bypass permissions selectable in Code sessions"
doc = "https://code.claude.com/docs/en/desktop"
marker = "bypassPermissionsModeEnabled"

[[features]]
kind = "integration"
name = "Dispatch"
summary = "Tasks sent from the Claude mobile app run on this machine and can spawn Code sessions"
doc = "https://support.claude.com/en/articles/13947068-assign-tasks-from-anywhere-in-claude-cowork"
marker = "dispatchCodeTasksPermissionMode"
checks = ["no-approval"]

[[features]]
kind = "path"
name = "~/Library/Application Support/Claude/claude_desktop_config.json"
summary = "Local MCP servers Desktop starts and loads into Code tab sessions"
doc = "https://code.claude.com/docs/en/mcp-quickstart"
marker = "claude_desktop_config.json"
checks = ["dangling", "autostart"]

[[features]]
kind = "integration"
name = "desktop extensions"
summary = "One-click local MCP servers (.mcpb) that run with your permissions; sensitive settings in the OS secure store"
doc = "https://support.claude.com/en/articles/10949351-getting-started-with-local-mcp-servers-on-claude-desktop"
marker = "Claude Extensions Settings"
checks = ["autostart", "creds-plaintext"]

[[features]]
kind = "setting"
name = "desktop extension allowlist"
summary = "Organization allowlist of desktop extensions; off by default"
doc = "https://support.claude.com/en/articles/12592343-enabling-and-using-the-desktop-extension-allowlist"
marker = "dxt:allowlistEnabled"

[[features]]
kind = "integration"
name = "Remote Control"
summary = "Code sessions here can be viewed and steered from claude.ai/code and the Claude apps"
doc = "https://code.claude.com/docs/en/remote-control"
marker = "remote-control-state.json"
checks = ["remote-control"]

[[features]]
kind = "setting"
name = "ccRemoteControlDefaultEnabled"
summary = "Connect new sessions to Remote Control: every new Code session connects automatically"
doc = "https://code.claude.com/docs/en/desktop"
marker = "ccRemoteControlDefaultEnabled"
checks = ["remote-control"]

[[features]]
kind = "integration"
name = "SSH sessions"
summary = "Code sessions on remote machines over SSH; Desktop keeps a controller token per host"
doc = "https://code.claude.com/docs/en/desktop"
marker = "ssh-remote-server-state"
checks = ["remote-control", "creds-plaintext"]

[[features]]
kind = "integration"
name = "scheduled tasks"
summary = "Local tasks start sessions on a schedule while the app is open, each with its own permission mode"
doc = "https://code.claude.com/docs/en/desktop-scheduled-tasks"
marker = "scheduled-tasks.json"
checks = ["autostart", "no-approval"]

[[features]]
kind = "setting"
name = "keepAwakeEnabled"
summary = "Keep computer awake while sessions and scheduled tasks work"
doc = "https://code.claude.com/docs/en/desktop-scheduled-tasks"
marker = "keepAwakeEnabled"

[[features]]
kind = "setting"
name = "chicagoEnabled"
summary = "Enable computer use: Claude clicks and types in your apps with no sandbox"
doc = "https://support.claude.com/en/articles/14128542-let-claude-use-your-computer-in-cowork"
marker = "chicagoEnabled"
checks = ["computer-control"]

[[features]]
kind = "setting"
name = "coworkBrowserToolsEnabled"
summary = "Browser tools in Cowork and Code sessions"
doc = "https://code.claude.com/docs/en/desktop"
marker = "coworkBrowserToolsEnabled"

[[features]]
kind = "integration"
name = "Cowork VM"
summary = "Shell commands and code from Cowork run in a local Linux VM with its own egress filtering"
doc = "https://support.claude.com/en/articles/14479288-claude-cowork-architecture-overview"
