[[endpoints]]
host = "claude.ai"
purpose = "Claude web app and sign-in"

[[endpoints]]
host = "api.anthropic.com"
purpose = "Anthropic API"

[[endpoints]]
host = "mcp-proxy.anthropic.com"
purpose = "MCP proxy (MCP_PROXY_URL)"

[[endpoints]]
host = "bridge.claudeusercontent.com"
purpose = "Bridge to the Claude in Chrome extension"

[[endpoints]]
host = "downloads.claude.ai"
purpose = "Downloads"

[[fingerprint]]
label = "Data folder"
value = "~/Library/Application Support/Claude"
marker = "claude_desktop_config.json"

[[fingerprint]]
label = "Account token"
value = "oauth:tokenCacheV2 in config.json, Electron safeStorage ciphertext"
marker = "oauth:tokenCacheV2"

[[fingerprint]]
label = "Code session permission modes"
value = "default, acceptEdits, plan, auto, bypassPermissions"
marker = "bypassPermissions"

[[fingerprint]]
label = "Claude in Chrome modes"
value = "ask, follow_a_plan, skip_all_permission_checks"
marker = "skip_all_permission_checks"

[remedies.require-approval]
summary = "Require approval in Code sessions, Claude in Chrome and scheduled tasks"
commands = [
  { manual = "Switch each Bypass permissions session to another mode with the selector under the prompt box, and turn off Allow bypass permissions mode in Settings > Code", markers = ["bypassPermissions", "bypassPermissionsModeEnabled"] },
  { manual = "Set Claude in Chrome to Manually approve or Automatically approve instead of Skip all approvals in each session and scheduled task", markers = ["Skip all approvals", "skip_all_permission_checks"] },
]

[remedies.remove-mcp]
summary = "Remove the server entry"
commands = [
  { manual = "Delete mcpServers.$name from ~/Library/Application Support/Claude/claude_desktop_config.json, then quit and reopen Claude Desktop", markers = ["mcpServers", "claude_desktop_config.json"] },
]

