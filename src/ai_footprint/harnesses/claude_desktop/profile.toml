# claude_desktop: what ai-footprint knows about this harness. Schema: harnesses/profile.py.
#
# Claude Desktop is Anthropic's Electron app. Besides chat it runs Cowork (agent mode: an
# agent loop on this machine whose shell commands run in a local Linux VM) and Claude Code
# sessions in its Code tab, using Claude Code builds it downloads into its own folder. Its
# JavaScript lives in Contents/Resources/app.asar, where markers are searched.
name = "claude_desktop"
display_name = "Claude Desktop"
binaries = []
process = "/Claude\\.app/Contents/"
presence = ["{support}", "{logs}"]
process_words = ["claudefordesktop"]
env_prefixes = ["CLAUDE_DESKTOP_"]
capabilities = ["remote-control"]
settings = [
  "mcpServers",
  "preferences",
  "coworkUserFilesPath",
  "permissionMode",
  "chromePermissionMode",
  "bypassPermissionsModeEnabled",
  "dispatchCodeTasksPermissionMode",
  "ccRemoteControlDefaultEnabled",
  "chicagoEnabled",
  "coworkBrowserToolsEnabled",
  "coworkScheduledTasksEnabled",
  "ccdScheduledTasksEnabled",
  "keepAwakeEnabled",
]

[roots]
support = { default = "~/Library/Application Support/Claude" }
logs = { default = "~/Library/Logs/Claude" }
third_party = { default = "~/Library/Application Support/Claude-3p" }
user_apps = { default = "~/Applications" }
system_apps = { default = "/Applications" }

[signals]
approval_off = { "preferences.dispatchCodeTasksPermissionMode" = "bypassPermissions" }
approval_off_flagged = [
  "sessions with permissionMode=bypassPermissions",
  "sessions with chromePermissionMode=skip_all_permission_checks",
  "scheduled tasks that skip approval",
]

[[artifacts]]
label = "App state and sign-in"
path = "{support}/config.json"
category = "credential"
description = "App state and the claude.ai OAuth token cache (oauth:tokenCacheV2), stored as Electron safeStorage ciphertext whose key is in the Keychain"

[[artifacts]]
label = "SSH remote state"
path = "{support}/ssh-remote-server-state.json"
category = "credential"
description = "Controller tokens for SSH remote machines, one per host, as safeStorage ciphertext"

[[artifacts]]
label = "Extension settings"
path = "{support}/Claude Extensions Settings"
category = "credential"
description = "Per desktop extension: enabled state and user_config; sensitive values are safeStorage ciphertext (__encrypted__:)"

[[artifacts]]
label = "Cookies"
path = "{support}/Cookies"
category = "credential"
description = "Electron cookie store, including the claude.ai sign-in cookies"

[[artifacts]]
label = "Spaces link key"
path = "{support}/spaces-present"
category = "credential"
description = "Per-account link-key file (safeStorage ciphertext)"

[[artifacts]]
label = "MCP servers and preferences"
path = "{support}/claude_desktop_config.json"
category = "config"
description = "Local MCP servers Desktop starts (mcpServers) and app preferences, including Code, Cowork, Dispatch, computer use and Remote Control settings"

[[artifacts]]
label = "Third-party mode config"
