description = "Recent plan usage samples"

[[artifacts]]
label = "Electron preferences"
path = "{support}/Preferences"
category = "config"
description = "Chromium profile preferences"

[[artifacts]]
label = "Desktop extensions"
path = "{support}/Claude Extensions"
category = "extension"
