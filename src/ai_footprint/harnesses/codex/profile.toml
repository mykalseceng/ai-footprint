# codex: what ai-footprint knows about this harness. Schema: harnesses/profile.py.
name = "codex"
display_name = "Codex CLI"
binaries = ["codex"]
process = "(^|/)codex(\\s|$)|codex-darwin"
presence = ["{home}"]
process_words = ["codex"]
env_prefixes = ["CODEX_"]
capabilities = ["account-signals"]
settings = ["approval_policy", "sandbox_mode", "notify", "cli_auth_credentials_store", "persistence", "trust_level", "project_doc_fallback_filenames", "daemon_auto_start"]

[roots]
home = { env = "CODEX_HOME", default = "~/.codex" }

