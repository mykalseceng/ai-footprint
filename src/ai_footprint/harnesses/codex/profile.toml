[[endpoints]]
host = "chatgpt.com"
purpose = "Codex responses API on your ChatGPT plan (backend-api)"

[[endpoints]]
host = "auth.openai.com"
purpose = "OAuth login and token refresh"

[[endpoints]]
host = "api.openai.com"
purpose = "OpenAI API (API-key mode)"

[[fingerprint]]
label = "Originator header"
value = "originator: codex_cli_rs"
marker = "codex_cli_rs"

[[fingerprint]]
label = "User-Agent"
value = "codex_cli_rs/{version} (…)"
marker = "codex_cli_rs"

[[fingerprint]]
label = "Responses endpoint"
value = "https://chatgpt.com/backend-api/codex/…"
marker = "chatgpt.com/backend-api"

[[fingerprint]]
label = "Auth endpoint"
value = "https://auth.openai.com (token refresh)"
marker = "auth.openai.com"

[[fingerprint]]
label = "Credential store option"
value = "cli_auth_credentials_store = file | keyring | auto"
marker = "cli_auth_credentials_store"

[[fingerprint]]
label = "Instruction files"
value = "AGENTS.md, AGENTS.override.md, project_doc_fallback_filenames"
marker = "AGENTS.override.md"

[signals]
approval_off = { approval_policy = "never", sandbox_mode = "danger-full-access" }
approval_off_flagged = ["threads with approval_mode=never"]

[[host_control]]
glob = "{home}/computer-use/*.app"
detail = "helper app in Codex's computer-use folder"

[remedies.require-approval]
summary = "Require approval and restore the sandbox in ~/.codex/config.toml"
commands = [
  { manual = "Set approval_policy = \"on-request\" and sandbox_mode = \"workspace-write\"", markers = ["on-request", "workspace-write"] },
  { manual = "Remove shell aliases that add --dangerously-bypass-approvals-and-sandbox" },
]

[remedies.protect-credentials]
summary = "Move Codex tokens into the OS keyring"
commands = [
  { manual = "Add cli_auth_credentials_store = \"keyring\" to ~/.codex/config.toml", markers = ["cli_auth_credentials_store", "keyring"] },
  { run = "codex logout", help = ["logout"] },
  { run = "codex login", help = ["login"] },
]

[remedies.stop-daemons]
summary = "Stop the managed daemon and its updater, and turn auto-start off"
commands = [
  { run = "codex app-server daemon stop", help = ["app-server", "daemon", "stop"] },
  { run = "pkill -f 'app-server daemon pid-update-loop'" },
  { run = "codex features disable daemon_auto_start", help = ["features", "disable"], markers = ["daemon_auto_start"] },
]

[remedies.remove-mcp]
summary = "Remove the server entry"
commands = [{ run = "codex mcp remove $name", help = ["mcp", "remove"] }]

[remedies.withdraw-trust]
summary = "Withdraw trust from folders you do not own or no longer use"
commands = [
  { manual = "Set trust_level = \"untrusted\" for those [projects.\"…\"] entries in ~/.codex/config.toml", markers = ["trust_level"] },
]

[remedies.data-controls]
summary = "Review the provider's data settings"
commands = [
  { manual = "Review Data controls at platform.openai.com and chatgpt.com, and remove cloud repos you do not need" },
]

