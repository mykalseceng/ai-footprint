[[artifacts]]
label = "Plugin staging"
path = "{home}/.tmp"
category = "extension"
description = "Plugin marketplaces Codex loads (openai/plugins clone, installed marketplaces), Git staging, plugin backups"

[[artifacts]]
label = "Imported skills"
