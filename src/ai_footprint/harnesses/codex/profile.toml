[[features]]
kind = "setting"
name = "approval_policy"
summary = "When Codex pauses for approval; never runs every command without asking"
doc = "https://learn.chatgpt.com/docs/config-file/config-reference"
marker = "approval_policy"
checks = ["no-approval"]

[[features]]
kind = "setting"
name = "sandbox_mode"
summary = "Filesystem and network sandbox for commands; danger-full-access removes it"
doc = "https://learn.chatgpt.com/docs/config-file/config-reference"
marker = "sandbox_mode"
checks = ["no-approval"]

[[features]]
kind = "subcommand"
name = "--dangerously-bypass-approvals-and-sandbox"
summary = "Flag (alias --yolo) that turns off both approval prompts and the sandbox"
doc = "https://learn.chatgpt.com/docs/agent-approvals-security"
marker = "dangerously-bypass-approvals-and-sandbox"
checks = ["no-approval"]

[[features]]
kind = "setting"
name = "approvals_reviewer"
summary = "auto_review lets a reviewer subagent answer approval prompts instead of you"
doc = "https://learn.chatgpt.com/docs/config-file/config-reference"
marker = "approvals_reviewer"

[[features]]
kind = "setting"
name = "sandbox_workspace_write.network_access"
summary = "Allows outbound network access inside the workspace-write sandbox"
doc = "https://learn.chatgpt.com/docs/config-file/config-reference"
marker = "network_access"

[[features]]
kind = "setting"
name = "mcp_servers"
summary = "MCP servers Codex starts (stdio command) or connects to (URL) in every session"
doc = "https://learn.chatgpt.com/docs/extend/mcp"
marker = "mcp_servers"
checks = ["autostart"]

[[features]]
kind = "setting"
name = "mcp_oauth_credentials_store"
summary = "Where MCP OAuth tokens are kept: auto, file or keyring"
doc = "https://learn.chatgpt.com/docs/config-file/config-reference"
marker = "mcp_oauth_credentials_store"

[[features]]
kind = "setting"
name = "cli_auth_credentials_store"
summary = "Where the CLI keeps its login: file (plaintext auth.json), keyring, auto or ephemeral"
doc = "https://learn.chatgpt.com/docs/auth"
marker = "cli_auth_credentials_store"
checks = ["creds-plaintext"]

[[features]]
kind = "hook"
name = "hooks.json"
summary = "Commands run on lifecycle events such as PreToolUse and SessionStart"
doc = "https://learn.chatgpt.com/docs/hooks"
marker = "hooks.json"
checks = ["autostart"]

[[features]]
kind = "setting"
name = "hooks"
summary = "Inline [hooks] tables in config.toml, loaded alongside hooks.json"
doc = "https://learn.chatgpt.com/docs/hooks"
marker = "PreToolUse"

[[features]]
kind = "setting"
name = "notify"
summary = "External program run with a JSON payload when a turn completes"
doc = "https://learn.chatgpt.com/docs/config-file/config-advanced"
marker = "notify"
checks = ["autostart"]

[[features]]
kind = "setting"
name = "history.persistence"
summary = "save-all writes every prompt to history.jsonl; none turns it off"
doc = "https://learn.chatgpt.com/docs/config-file/config-advanced"
