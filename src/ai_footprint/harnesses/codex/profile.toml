[[artifacts]]
label = "Queue DB shared memory"
path = "{home}/queue_1.sqlite-shm"
category = "session"
description = "Index into the Queue DB write-ahead log"

[[artifacts]]
label = "Desktop app databases"
path = "{home}/sqlite"
category = "session"
description = "The desktop app's own SQLite databases (codex.db, codex-thread-summaries.db)"

[[artifacts]]
