path = "{home}/auth.json"
category = "credential"
description = "ChatGPT OAuth JWTs and refresh token, or an API key, in plaintext"

[[artifacts]]
label = "Config"
path = "{home}/config.toml"
category = "config"
description = "Approval policy, sandbox, MCP servers, plugins, trusted projects"

[[artifacts]]
label = "Hooks"
path = "{home}/hooks.json"
category = "extension"
description = "Commands run on tool events"

[[artifacts]]
label = "Command rules"
path = "{home}/rules"
category = "config"
description = "Pre-approved command prefixes"

[[artifacts]]
label = "Global instructions"
path = "{home}/AGENTS.md"
category = "instructions"
description = "Loaded into every session"

[[artifacts]]
label = "Global override"
path = "{home}/AGENTS.override.md"
category = "instructions"
description = "Replaces AGENTS.md when present"

[[artifacts]]
label = "Sessions"
path = "{home}/sessions"
category = "session"
description = "Rollout files: full conversations and tool output"

[[artifacts]]
label = "Archived sessions"
path = "{home}/archived_sessions"
category = "session"
description = "Older rollouts"

[[artifacts]]
label = "Prompt history"
path = "{home}/history.jsonl"
