[[features]]
kind = "setting"
name = "otel.log_user_prompt"
summary = "Includes raw prompt text in exported OpenTelemetry logs"
doc = "https://learn.chatgpt.com/docs/config-file/config-reference"
marker = "log_user_prompt"

[[features]]
kind = "setting"
name = "shell_environment_policy"
summary = "Which environment variables, secrets included, spawned commands inherit"
doc = "https://learn.chatgpt.com/docs/config-file/config-advanced"
marker = "shell_environment_policy"

[[features]]
kind = "setting"
name = "projects.<path>.trust_level"
