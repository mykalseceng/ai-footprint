[[features]]
kind = "setting"
name = "permission"
summary = "allow, ask or deny per tool; most tools run without approval by default"
doc = "https://docs.opencode.ai/docs/permissions/"
marker = "\"permission\""
checks = ["no-approval"]

[[features]]
kind = "setting"
name = "share"
summary = "manual, auto or disabled; auto uploads every new session to a public link"
doc = "https://github.com/anomalyco/opencode/blob/v1.4.6/packages/web/src/content/docs/share.mdx"
marker = "\"manual\",\"auto\",\"disabled\""
checks = ["shared"]

[[features]]
kind = "setting"
name = "autoupdate"
summary = "Update checks and notices; false turns them off, updates are never installed automatically"
doc = "https://docs.opencode.ai/docs/config/"
marker = "autoupdate:"

[[features]]
kind = "setting"
name = "plugin"
summary = "npm plugins installed with Bun and loaded in-process at startup"
doc = "https://docs.opencode.ai/docs/plugins/"
marker = "\"plugin\""

[[features]]
kind = "setting"
name = "instructions"
summary = "Extra instruction files, globs or remote URLs loaded into every session"
doc = "https://docs.opencode.ai/docs/rules/"
marker = "instructions:"
checks = ["instructions"]

[[features]]
kind = "setting"
name = "mcp"
summary = "Local MCP commands with their environment, and remote MCP URLs with headers or OAuth"
doc = "https://docs.opencode.ai/docs/mcp-servers/"
marker = "mcp:"
checks = ["dangling"]

[[features]]
kind = "setting"
name = "server"
summary = "Port, hostname, mDNS and CORS for serve and web; mDNS without a hostname listens on 0.0.0.0"
doc = "https://docs.opencode.ai/docs/config/"
marker = "mdnsDomain"
checks = ["daemons", "open-server"]

[[features]]
kind = "setting"
name = "provider"
summary = "Provider options including apiKey and baseURL; {env:} and {file:} substitute values"
doc = "https://docs.opencode.ai/docs/providers/"
marker = "{file:"

[[features]]
kind = "setting"
name = "enabled_providers"
summary = "Allowlist of providers; all others are ignored"
doc = "https://docs.opencode.ai/docs/config/"
marker = "enabled_providers"

[[features]]
kind = "setting"
name = "disabled_providers"
summary = "Providers never loaded, even with credentials in the environment or auth.json"
doc = "https://docs.opencode.ai/docs/config/"
marker = "disabled_providers"

[[features]]
kind = "setting"
name = "openTelemetry"
summary = "experimental.openTelemetry: OpenTelemetry spans for AI SDK calls (deprecated)"
doc = "https://opencode.ai/config.json"
marker = "openTelemetry"

[[features]]
kind = "env"
name = "OPENCODE_SERVER_PASSWORD"
summary = "Turns on HTTP Basic auth for serve and web; without it the server accepts any local caller"
doc = "https://docs.opencode.ai/docs/server/"
marker = "OPENCODE_SERVER_PASSWORD"
checks = ["open-server"]

[[features]]
kind = "env"
name = "OPENCODE_SERVER_USERNAME"
summary = "Basic-auth username for serve and web (default opencode)"
doc = "https://docs.opencode.ai/docs/server/"
marker = "OPENCODE_SERVER_USERNAME"
checks = ["open-server"]

[[features]]
kind = "env"
name = "OPENCODE_PERMISSION"
summary = "Inline JSON permission rules that apply on top of the config files"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_PERMISSION"

[[features]]
kind = "env"
name = "OPENCODE_AUTO_SHARE"
summary = "Shares every session automatically"
doc = "https://github.com/anomalyco/opencode/blob/v1.4.6/packages/web/src/content/docs/cli.mdx"
marker = "OPENCODE_AUTO_SHARE"
checks = ["shared"]

[[features]]
kind = "env"
name = "OPENCODE_CONFIG"
summary = "Extra config file loaded between the global and project configs"
doc = "https://docs.opencode.ai/docs/config/"
marker = "OPENCODE_CONFIG"

[[features]]
kind = "env"
name = "OPENCODE_CONFIG_DIR"
summary = "Extra config directory searched for agents, commands, modes and plugins"
doc = "https://docs.opencode.ai/docs/config/"
marker = "OPENCODE_CONFIG_DIR"

[[features]]
kind = "env"
name = "OPENCODE_CONFIG_CONTENT"
summary = "Inline JSON config that overrides the config files"
doc = "https://docs.opencode.ai/docs/config/"
marker = "OPENCODE_CONFIG_CONTENT"

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_PROJECT_CONFIG"
summary = "Ignores project config and project instruction files"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_DISABLE_PROJECT_CONFIG"

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_CLAUDE_CODE"
summary = "Stops reading .claude (CLAUDE.md and skills)"
doc = "https://docs.opencode.ai/docs/rules/"
marker = "OPENCODE_DISABLE_CLAUDE_CODE"
checks = ["instructions", "shared-surfaces"]

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_CLAUDE_CODE_PROMPT"
summary = "Stops reading ~/.claude/CLAUDE.md"
doc = "https://docs.opencode.ai/docs/rules/"
marker = "OPENCODE_DISABLE_CLAUDE_CODE_PROMPT"
checks = ["instructions"]

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_CLAUDE_CODE_SKILLS"
summary = "Stops loading .claude/skills"
doc = "https://docs.opencode.ai/docs/rules/"
marker = "OPENCODE_DISABLE_CLAUDE_CODE_SKILLS"
checks = ["shared-surfaces"]

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_EXTERNAL_SKILLS"
summary = "Stops skill discovery in .claude and .agents folders"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_DISABLE_EXTERNAL_SKILLS"
checks = ["shared-surfaces"]

[[features]]
kind = "env"
name = "OPENCODE_PURE"
summary = "Runs without external plugins, like --pure"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_PURE"

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_DEFAULT_PLUGINS"
summary = "Turns off the built-in default plugins"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_DISABLE_DEFAULT_PLUGINS"

[[features]]
kind = "env"
name = "OPENCODE_DISABLE_AUTOUPDATE"
summary = "Turns off update checks"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_DISABLE_AUTOUPDATE"

[[features]]
kind = "env"
name = "OPENCODE_DB"
summary = "Moves the session database; relative paths resolve under the data folder"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_DB"

[[features]]
kind = "env"
name = "OPENCODE_ENABLE_EXA"
summary = "Turns on the Exa web search tools, which send queries to Exa"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_ENABLE_EXA"

[[features]]
kind = "env"
name = "OPENCODE_MODELS_URL"
summary = "Fetches the model catalog from another URL"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "OPENCODE_MODELS_URL"

[[features]]
kind = "subcommand"
name = "serve"
summary = "Headless HTTP server that runs prompts and tools; open unless OPENCODE_SERVER_PASSWORD is set"
doc = "https://docs.opencode.ai/docs/server/"
marker = "starts a headless opencode server"
checks = ["daemons", "open-server"]

[[features]]
kind = "subcommand"
name = "web"
summary = "Server with a browser interface; same authentication as serve"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "start opencode server and open web interface"
checks = ["daemons", "open-server"]

[[features]]
kind = "subcommand"
name = "auth"
summary = "Log in to, list and log out of providers; keys and OAuth tokens go to auth.json"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "manage AI providers and credentials"
checks = ["creds-plaintext", "creds-readable", "duplicate-creds"]

[[features]]
kind = "subcommand"
name = "mcp auth"
summary = "OAuth login for a remote MCP server; tokens go to mcp-auth.json"
doc = "https://docs.opencode.ai/docs/mcp-servers/"
marker = "authenticate with an OAuth-enabled MCP server"

[[features]]
kind = "subcommand"
name = "plugin"
summary = "Installs an npm plugin and adds it to the project or global config"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "install plugin and update config"

[[features]]
kind = "subcommand"
name = "github install"
summary = "Adds a GitHub Actions workflow that runs the agent in a repository"
doc = "https://docs.opencode.ai/docs/cli/"
marker = "install the GitHub agent"

[[features]]
kind = "integration"
name = "remote config"
summary = "Organization defaults fetched from a provider's .well-known/opencode when you authenticate"
doc = "https://docs.opencode.ai/docs/config/"
marker = ".well-known/opencode"

[[features]]
kind = "integration"
name = "macOS managed preferences"
summary = "MDM-deployed ai.opencode.managed settings that override every other config"
doc = "https://docs.opencode.ai/docs/config/"
marker = "ai.opencode.managed"

[[features]]
kind = "path"
name = "/Library/Application Support/opencode"
summary = "Admin-managed opencode.json(c) that overrides user and project config"
doc = "https://docs.opencode.ai/docs/config/"
marker = "/Library/Application Support/opencode"
